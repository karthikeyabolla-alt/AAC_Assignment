<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Form</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        /* FORM CARD */
        .form-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
        }

        /* TITLE */
        h2 {
            margin-bottom: 20px;
            color: #1a1a2e;
        }

        /* ROW */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            font-size: 13px;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }

        /* INPUTS */
        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            background: #f9fafb;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: #fff;
        }

        /* BUTTONS */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit {
            background: #2563eb;
            color: #fff;
        }

        .reset {
            background: #e5e7eb;
        }

        /* FOOTER */
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="form-card">
        <h2>Student Review Form</h2>

        <form>

            <!-- NAME -->
            <div class="row">
                <div>
                    <label>First Name</label>
                    <input type="text" required>
                </div>
                <div>
                    <label>Last Name</label>
                    <input type="text" required>
                </div>
            </div>

            <!-- ROLL + BRANCH -->
            <div class="row">
                <div>
                    <label>Roll Number</label>
                    <input type="text" required>
                </div>
                <div>
                    <label>Branch</label>
                    <select required>
                        <option value="">Select</option>
                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>EEE</option>
                    </select>
                </div>
            </div>

            <!-- SECTION -->
            <div class="field">
                <label>Section</label>
                <input type="text" placeholder="e.g. A / B / C">
            </div>

            <!-- EMAIL -->
            <div class="field">
                <label>Email</label>
                <input type="email" required>
            </div>

            <!-- FEEDBACK TYPE -->
            <div class="field">
                <label>Feedback Type</label>
                <select>
                    <option>General Feedback</option>
                    <option>Suggestion</option>
                    <option>Issue</option>
                </select>
            </div>

            <!-- COMMENTS -->
            <div class="field">
                <label>Comments</label>
                <textarea rows="4" placeholder="Write your feedback..."></textarea>
            </div>

            <!-- BUTTONS -->
            <div class="btn-row">
                <button type="submit" class="submit">Submit</button>
                <button type="reset" class="reset">Reset</button>
            </div>

        </form>

        <div class="footer">
            Your response will be recorded for review purposes.
        </div>

    </div>

</body>

</html>
